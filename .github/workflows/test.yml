name: Tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unittest:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - run: python deploy/test-promote.py -v
      - run: python -m variational_grid.execution_drill
      - run: node --test tests/test_dashboard_model.cjs tests/test_inventory_dashboard_model.cjs tests/test_qqq_dashboard_model.cjs tests/test_qqq_dashboard_loading.cjs tests/test_hub_bridge.cjs tests/test_convergence_dashboard_model.cjs tests/test_convergence_dashboard_loading.cjs
      - run: node --check variational_grid/web/app.js
      - run: node --check variational_grid/web/inventory.js
      - run: node --check variational_grid/web/qqq.js
      - run: node --check variational_grid/web/convergence.js
      - run: node --check variational_grid/web/strategies.js
      - run: python -m variational_grid demo
      - if: runner.os == 'Linux' && matrix.python == '3.11'
        run: python -m variational_grid inventory-demo --output data/inventory-demo --trajectory trend
      - if: runner.os == 'Linux' && matrix.python == '3.11'
        run: python -m variational_grid qqq-demo --output data/qqq-demo
      - if: runner.os == 'Linux'
        run: bash -n install.sh
  release:
    needs: unittest
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: deployment-release-main
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python deploy/package-release.py --commit "$GITHUB_SHA"
      - run: python tests/smoke_release.py release-output
      - name: Publish immutable deployment assets after every required check
        run: python deploy/publish-release.py release-output
        env:
          GH_TOKEN: ${{ github.token }}
